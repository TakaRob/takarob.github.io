<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — not found</title>
  <style>
    body {
      color: #000;
      background: #fff;
      margin: 0;
      font-family: "Times New Roman", Times, Georgia, serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    @media (prefers-color-scheme: dark) {
      body {
        color: #fff;
        background: #111;
      }
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }
    p {
      font-size: 16px;
      margin-bottom: 16px;
    }
    a {
      color: #0000ee;
    }
  </style>
</head>
<body>
  <h1>404</h1>
  <p>This page could not be found.</p>
  <p>[ <a href="/">home</a> ]</p>
</body>
</html>
